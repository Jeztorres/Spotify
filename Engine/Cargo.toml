[package]
name = "spotifymac-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Motor de reproducción y lecturas de sesión de SpotifyMac (librespot). Se comunica por JSON en stdin/stdout."

[dependencies]
# Reproducción, Spotify Connect y metadatos por la sesión de streaming.
# rodio-backend: salida por CoreAudio sin código propio de audio.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots", "rodio-backend"] }
librespot-connect = { version = "0.8", default-features = false }
librespot-metadata = { version = "0.8", default-features = false }
librespot-protocol = { version = "0.8", default-features = false }
librespot-oauth = { version = "0.8", default-features = false }
protobuf = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
sha1 = "0.10"
hex = "0.4"
futures-util = { version = "0.3", default-features = false }
biquad = "0.4"

[profile.release]
opt-level = 3
strip = true

# La misma revisión de librespot que usa Spotifast (MIT, github.com/crmne/librespot):
# pide las claves de audio de una en una con espera tras un rechazo (#1844), descarta cargas
# ya saltadas (#1845) y precarga solo la clave de la siguiente canción (#1846).
# Sin esto Spotify rechaza claves en cascada ("error audio key 0 1").
[patch.crates-io]
librespot-audio = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-connect = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-core = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-metadata = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-oauth = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-playback = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-protocol = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
