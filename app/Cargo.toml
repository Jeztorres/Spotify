[package]
name = "spotify-win"
version = "0.1.0"
edition = "2021"
publish = false
description = "SpotifyMac para Windows: interfaz en Slint, sin navegador embebido."

[dependencies]
spotify-core = { path = "../core" }
serde_json = "1"
# Soloist: WebSocket local síncrono y descompresión del zip oficial.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# GPU por defecto; software como respaldo. Winit adapta el repintado a los Hz del monitor actual.
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "unstable-winit-030"] }
# Portadas: HTTP bloqueante (sin tokio) y solo los formatos que sirve Spotify.
ureq = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

arboard = { version = "3.7", default-features = false }
souvlaki = "0.8"
rust-i18n = "3"
# Letras TTML de AMLL TTML DB (cantante por línea, como Apple Music).
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
# Credenciales en el Administrador de credenciales de Windows.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.60", features = ["Win32_UI_Controls_Dialogs", "Win32_Media", "Win32_System_Threading", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
