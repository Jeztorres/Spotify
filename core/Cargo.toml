[package]
name = "spotify-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Modelos y lógica pura de SpotifyMac, portados de Swift. Sin dependencias de UI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
